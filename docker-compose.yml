services:

  # ── Base de datos PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-ctt
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ctt-network
    # Puerto 5432 deshabilitado en produccion.
    # Habilitar solo temporalmente para pgAdmin / DBeaver / psql.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Aplicacion FastAPI ────────────────────────────────────────────────────────
  ctt-api:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ctt-fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./static/images:/app/static/images
      - ./static/images:/app/static/pdf
      - ./static/images:/app/static/svg
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ctt-network
    dns:
      - 8.8.8.8
      - 8.8.4.4

# ── Recursos compartidos ──────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  ctt-network:
    driver: bridge
